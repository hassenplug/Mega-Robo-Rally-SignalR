<html>
<head>

<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel="stylesheet" type="text/css" href="style/checkbox.css">
<link rel="stylesheet" type="text/css" href="style/button.css">
<link rel="stylesheet" type="text/css" href="style/w3.css">

<meta name="theme-color" content="#aaffff">

<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<script src="js/signalr.min.js"></script>
<script src="js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/datahub-connection.js" type="text/javascript" charset="utf-8"></script>
<script src="js/loadrobots.js" type="text/javascript" charset="utf-8"></script>

<title>MEGA Robo Rally - GM</title>

<style>
/* Built around the Pi's 800x480 kiosk screen (Hosyond 5" DSI): one fixed screen, no page scroll.
   Left pane = robot table, right pane = buttons. Sizes are for finger taps on a 5" panel. */
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#ffffff; font-size:18px; }
#app { display:flex; flex-direction:column; width:100vw; height:100vh; }

#topBar { display:flex; align-items:stretch; height:56px; flex:none; background:#d0d0d0; }
#robotHeader { position:relative; width:64px; flex:none; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; user-select:none; }
#title { flex:1; display:flex; align-items:center; padding:0 10px; font-weight:bold; font-size:20px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#flagsHeader { width:130px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; user-select:none; border-left:1px solid #a0a0a0; }

#panes { display:flex; flex:1; min-height:0; }
#robotPane { flex:none; width:490px; overflow-y:auto; }
#buttonPane { flex:1; min-width:0; overflow-y:auto; background:#e0e0e0; padding:6px; box-sizing:border-box; }

#mainTable { width:100%; border-collapse:collapse; table-layout:fixed; }
#mainTable td { height:66px; padding:2px 3px; border-bottom:1px solid #e0e0e0; overflow:hidden; }
#mainTable td.cConnect { width:52px; }
#mainTable td.cFlags   { width:110px; text-align:center; background:#e0e0e0; font-weight:bold; }
#mainTable td.cStatus  { text-align:center; line-height:1.15; }

/* The global .button is width:100%/height:30px; the GM page wants finger-sized buttons. */
#app .button { height:auto; min-height:48px; font-size:18px; padding:4px 10px; box-sizing:border-box; }
#mainTable .button { width:100%; height:56px; font-size:20px; padding:2px 4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

/* Narrow, text-free connect toggle -- its color is the robot's ConnectStatusColor. */
.connectBtn { width:44px; height:56px; padding:0; border:1px solid #808080; cursor:pointer; }

#gmMenu { display:none; position:absolute; top:100%; left:0; z-index:5; background:#ffffff; padding:6px; width:200px; text-align:left; font-size:18px; }
#gmMenu .button { display:block; width:100%; margin-bottom:6px; }
#programScreenSubmenu { display:none; position:absolute; top:0; left:100%; z-index:6; background:#ffffff; padding:6px; width:130px; }
#playerButtons .button { display:block; width:100%; margin:0 0 6px 0; background-color:#ff0000; color:#ffffff; white-space:normal; }
#programPanel img { width:50px; cursor:pointer; }
/* The robot whose program is showing on the right (F/E/C view only). */
#mainTable .button.selectedRobot { outline:4px solid #000000; outline-offset:-4px; }
</style>

</head>
<body id='body'>

<!-- GM-only status page, the Pi's own kiosk screen (~/.local/bin/mrr-kiosk.sh). Same
     js/loadrobots.js as index.html, always logged in as GM and always in GM view: each robot
     row is [connect toggle][robot][F/E/C][status]. In the F/E/C view, tapping a robot shows its
     program on the right (index.html's card area); in the battery view, tapping a disconnected
     robot swaps its base and the right side collects every player's pending PlayerMsg and
     direction buttons. buildPlayerRows/showall are replaced by the script at the bottom of this
     page; everything else (login, showplayerprogram, GM menu actions, connect/disconnect, start
     game) is loadrobots.js's own code. -->

<!-- Not normally shown: the GM cookie is set below before the first datapacket. Kept because
     applyLogin() falls back to it if the cookie is ever missing. -->
<div id="loginModal" class="w3-modal">
    <div class="w3-modal-content w3-round w3-white" style="max-width:320px; padding:16px;">
        <h3 style="margin-top:0;">Enter your seat number:</h3>
        <input type="text" id="seatLoginInput" class="w3-input" inputmode="numeric" autocomplete="off">
        <button class="button" style="margin-top:8px; background-color:#444444; color:#ffffff;" onclick="attemptSeatLogin();">Log In</button>
        <p id="loginError" style="color:#cc0000; display:none;">Invalid seat.</p>
    </div>
</div>

<!-- Swap a disconnected robot onto a different physical base: opened by tapping that robot's name
     (see openBasePicker below). -->
<!-- Just the list of AIM names in a small box: no title, no Cancel button -- tapping anywhere
     outside the box closes it. -->
<div id="basePicker" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:10;" onclick="closeBasePicker();">
    <div id="basePickerList" style="position:absolute; top:60px; left:60px; background:#ffffff; border:1px solid #808080; padding:4px; max-height:85vh; overflow:auto;" onclick="event.stopPropagation();"></div>
</div>

<!-- QR codes for players joining: the game Wi-Fi (Mega_Robo_Rally) and this server's player
     page. Opened from the GM menu; tapping anywhere closes it. Images made once with the Python
     qrcode package: "WIFI:T:WPA;S:Mega_Robo_Rally;P:Rallypass;;" and
     "http://192.168.0.100:5000/index.html". -->
<div id="qrCodes" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:10; background:rgba(0,0,0,0.6); text-align:center; overflow:auto;" onclick="this.style.display='none';">
    <div style="display:inline-block; background:#ffffff; margin-top:30px; padding:12px; border-radius:6px;">
        <div style="display:inline-block; margin:8px; vertical-align:top;">
            <img src="images/qr_wifi.png" style="width:240px; height:240px;"><br>1. Join Wi-Fi: Mega_Robo_Rally
        </div>
        <div style="display:inline-block; margin:8px; vertical-align:top;">
            <img src="images/qr_index.png" style="width:240px; height:240px;"><br>2. Open Player Index
        </div>
    </div>
</div>

<div id="app">
<div id="topBar">
    <!-- The header opens the GM menu (5 taps in 10s still logs out). -->
    <div id="robotHeader" onclick="handleRobotHeaderTap();">&#9776;
        <div id="gmMenu" class="w3-card-4">
            <button class="button" onclick="event.stopPropagation(); window.open('turnhistory.html', '_blank');">Turn History</button>
            <button class="button" onclick="event.stopPropagation(); document.getElementById('qrCodes').style.display='block';">QR Codes</button>
            <button class="button" id="showCardsBtn" onclick="event.stopPropagation(); toggleShowCards();">Show Cards: Off</button>
            <div style="position:relative;">
                <button class="button" onclick="event.stopPropagation(); toggleProgramScreenSubmenu();">Program Screen</button>
                <div id="programScreenSubmenu" class="w3-card-4">
                    <button class="button" style="margin-bottom:6px;" onclick="event.stopPropagation(); gmSetRobotScreen(true);">Enable</button>
                    <button class="button" onclick="event.stopPropagation(); gmSetRobotScreen(false);">Disable</button>
                </div>
            </div>
            <button class="button" onclick="event.stopPropagation(); gmAction('nextstate');">Next State</button>
            <button class="button" style="background-color:#cc0000; color:#ffffff;" onclick="event.stopPropagation(); if(confirm('End the current game and disconnect from robots?')) gmAction('endgame');">End Game</button>
        </div>
    </div>
    <!-- Game message (titlemsg), filled in by showall(). -->
    <div id="title">---</div>
    <div id="flagsHeader" onclick="toggleFlagsHeader();">F/E/C</div>
</div>

<div id="panes">
    <div id="robotPane">
        <table id="mainTable" bgcolor="ffffff" border=0><tbody id="playerRows"></tbody></table>
    </div>

    <!-- Right pane. The GM start-game picker while no game is running (gamestate 25), then:
         F/E/C view: the program panel (index.html's showProgramTemplate, minus its gmtable) for
         the robot picked by tapping its button -- js/loadrobots.js's showplayerprogram() fills it.
         Battery view: one button per robot with a pending PlayerMsg, and a direction row per
         robot whose direction isn't locked yet. -->
    <div id="buttonPane">
        <div id="gmtable" style="display:none; margin-bottom:6px;">
            <button class="button" style="width:auto; padding:6px 20px; background-color:#008000; color:#ffffff;" onclick="startSelectedGame();">Start</button>
            <select id="gameDataSelect" class="w3-input" style="display:inline-block; width:auto; font-size:18px; height:48px;"></select>
        </div>
        <!-- Player message and direction buttons: shown in both views, above the program panel. -->
        <div id="batteryButtons">
            <div id="playerButtons"></div>
            <div id="directionButtons"></div>
            <div id="noPlayerButtons" style="color:#606060;">No player buttons</div>
        </div>
        <div id="programPanel">
            <table width="100%">
                <tr id="messagetable" style="display: none;">
                    <td colspan="5">
                        <button class='button' id="btnMessagebox" style='background-color:#ff0000; color:#ffffff; white-space:normal;' onclick='confirmMessage();'>PlayerMsg</button>
                    </td>
                </tr>
                <tr id="directionPickerRow" style="display: none;">
                    <td colspan="5" align="center">
                        <img id="directionBtn" src="images/Direction1.png" onclick="cycleDirection();" style="width:48px; height:48px;">
                        <button id="directionConfirmBtn" class="button" style="width:auto; background-color:#800080; color:#ffffff;" onclick="confirmDirection();">Set Direction</button>
                    </td>
                </tr>
                <tr id="messagetablespace" style="display: none;"><td colspan="5"></td></tr>
                <!-- Played and dealt cards: hidden unless "Show Cards" is on in the menu
                     (toggleShowCards). A tbody of their own because showplayerprogram() sets the
                     dealt rows' display itself on every update. -->
                <tbody id="cardRows" style="display:none;">
                <tr bgcolor="#d0d0d0">
                    <td align=center bgcolor=ffffff id='CardCell0'><img id='Played0' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff id='CardCell1'><img id='Played1' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff id='CardCell2'><img id='Played2' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff id='CardCell3'><img id='Played3' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff id='CardCell4'><img id='Played4' src='images/type0.png' onclick='PlayCard(this);'></td>
                </tr>
                <tr><td colspan="5" style="height:10px;"></td></tr>
                <tr id="DealtRow1">
                    <td align=center bgcolor=ffffff><img id='Dealt0' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt1' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt2' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt3' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt4' src='images/type0.png' onclick='PlayCard(this);'></td>
                </tr>
                <tr id="DealtRow2">
                    <td align=center bgcolor=ffffff><img id='Dealt5' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt6' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt7' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt8' src='images/type0.png' onclick='PlayCard(this);'></td>
                    <td align=center bgcolor=ffffff><img id='Dealt9' src='images/type0.png' onclick='PlayCard(this);'></td>
                </tr>
                </tbody>
                <!-- Tapping the robot's status swaps the dealt hand for this panel (toggleExtrasPanel). -->
                <tr id="extrasRow" style="display: none;">
                    <td colspan="5" align="center">
                        <button id="shutDownBtn" class="button" style="width:auto; margin:6px 0;" onclick="toggleShutDown();">Shut Down</button>
                    </td>
                </tr>
                <tr id="shutDownRow" style="display: none;">
                    <td colspan="5" align="center">
                        <button id="shutDownCancelBtn" class="button" style="width:auto; background-color:#ffff00; color:#000000;" onclick="toggleShutDown();">Shutting Down &mdash; Cancel</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
</div>

<script>
// This page is always GM: set the same cookie the login box would, before the first
// datapacket arrives, and start in GM view (connect toggles + GM menu enabled).
setLoginCookie(GM_CODE);
gmViewActive = true;

function buildPlayerRows(robots) {
    if (robots.length === lastPlayerCount) return;
    lastPlayerCount = robots.length;

    var html = '';
    for (var i = 0; i < robots.length; i++) {
        var rid = i + 1;
        html += "<tr id='tr" + rid + "'>" +
            "<td class='cConnect' align=center><button class='connectBtn' id='connect" + rid + "'></button></td>" +
            "<td><button class='button' id='button" + rid + "'>--</button></td>" +
            "<td class='cFlags' id='flags" + rid + "'>--</td>" +
            "<td class='cStatus' id='playerstatus" + rid + "'>--</td>" +
            "</tr>";
    }
    document.getElementById('playerRows').innerHTML = html;
}

// Menu "Show Cards" toggle, off on every page load: whether the right panel shows the picked
// robot's played and dealt cards.
var showCards = false;

function toggleShowCards() {
    showCards = !showCards;
    document.getElementById('showCardsBtn').textContent = 'Show Cards: ' + (showCards ? 'On' : 'Off');
    document.getElementById('cardRows').style.display = showCards ? '' : 'none';
}

// F/E/C view: tapping a robot's button shows its program on the right.
function selectRobot(priority) {
    showplayerprogram(priority);
    showall(); // move the selected-robot outline
}

function showall() {
    var robots = datapacket.robots;
    buildPlayerRows(robots);

    document.getElementById('title').innerText = datapacket.titlemsg;

    var showGmStart = datapacket.gamestate === 25;
    document.getElementById('gmtable').style.display = showGmStart ? '' : 'none';
    if (showGmStart && gameDataOptions === null) loadGameDataOptions();

    document.getElementById('programPanel').style.display = batteryMode ? 'none' : '';

    // showplayerprogram() looks robots up by Priority (CurrentLine), which changes every turn:
    // follow the picked robot's new Priority so the panel stays on the same robot. Nothing
    // picked yet (or that robot left the game): show the first robot's program.
    var picked = robots.find(function (r) { return r.RobotID === CurrentPlayer; }) || robots[0];
    if (picked) {
        CurrentLine = picked.Priority;
        CurrentPlayer = picked.RobotID;
    }

    var msgRobots = [];

    for (var i = 0; i < robots.length; i++) {
        var r = robots[i];
        var rid = i + 1;

        var conn = document.getElementById('connect' + rid);
        conn.style.backgroundColor = "#" + r.ConnectStatusColor;
        conn.title = r.ConnectStatusDesc;
        conn.onclick = makeConnectHandler(r.RobotID, r.ConnectStatusID === CONNECT_STATUS_CONNECTED);

        var btn = document.getElementById('button' + rid);
        btn.style = "background-color:#" + r.RobotColor + "; color:#" + r.RobotColorFG;
        btn.textContent = r.RobotName;
        btn.classList.toggle('selectedRobot', !batteryMode && r.RobotID === CurrentPlayer);
        btn.onclick = batteryMode ? makeBasePickerHandler(r) : makeSelectRobotHandler(r.Priority);

        var flagsCell = document.getElementById('flags' + rid);
        var statusbox = document.getElementById('playerstatus' + rid);
        var info = robotInfo[r.RobotID];
        if (batteryMode) {
            // Battery view: last battery reading and board position (/api/robot/info), instead
            // of flags/energy/cards and the status text.
            // Location (with a rotated arrow image for the facing) sits in the narrow
            // column, battery % in the wide status column.
            var battery = info ? info.battery : 0;
            if (info) {
                flagsCell.innerText = 'R' + info.row + ' C' + info.col + ' ';
                if (DIRECTION_DEGREES[info.dir] !== undefined) {
                    var dirImg = document.createElement('img');
                    dirImg.src = 'images/Direction1.png';
                    dirImg.style = 'width:22px; height:22px; vertical-align:middle; transform:rotate(' + DIRECTION_DEGREES[info.dir] + 'deg);';
                    flagsCell.appendChild(dirImg);
                } else {
                    flagsCell.appendChild(document.createTextNode('?'));
                }
            } else {
                flagsCell.innerText = '--';
            }
            flagsCell.style.backgroundColor = '#e0e0e0';
            statusbox.innerText = battery > 0 ? battery + '%' : '--';
            statusbox.style.backgroundColor = battery <= 0 ? '#e0e0e0'
                : battery >= 50 ? '#80ff80' : battery >= 20 ? '#ffff80' : '#ff8080';
            statusbox.onclick = null;
        } else {
            flagsCell.innerText = r.FlagEnergyCards;
            flagsCell.style.backgroundColor = '#e0e0e0';
            statusbox.innerText = r.StatusToShow;
            statusbox.style.backgroundColor = "#" + r.StatusColor;
            // Same as index.html: tapping a status swaps the dealt hand for the extras panel
            // (Shut Down) -- for the robot whose program is showing.
            statusbox.onclick = toggleExtrasPanel;
        }

        if (r.PlayerMsg && r.PlayerMsg !== 'undefined') msgRobots.push(r);
    }

    // The server rebroadcasts every ~100ms while a command waits for input, so only rebuild
    // the buttons when the set of messages changes: replacing a button between press and
    // release means the click never reaches it.
    var buttons = document.getElementById('playerButtons');
    var msgKey = JSON.stringify(msgRobots.map(function (r) {
        return [r.RobotID, r.RobotName, r.PlayerMsg];
    }));
    if (msgKey !== lastPlayerMsgKey) {
        lastPlayerMsgKey = msgKey;
        buttons.innerHTML = '';
        msgRobots.forEach(function (r) { buttons.appendChild(makePlayerMsgButton(r)); });
    }

    var dirButtons = document.getElementById('directionButtons');
    var dirKey = JSON.stringify(robots.map(function (r) {
        return [r.RobotID, r.RobotName, r.PositionValid];
    }));
    if (dirKey !== lastDirectionKey) {
        lastDirectionKey = dirKey;
        dirButtons.innerHTML = '';
        directionArrows = {};
        robots.forEach(function (r) {
            if (r.PositionValid === 0 || r.PositionValid === 1) dirButtons.appendChild(makeDirectionRow(r));
        });
    }

    // Follow the server's Dir so a change made on a player's device shows up here too --
    // except just after a GM tap, so a broadcast landing between two quick taps doesn't snap
    // the arrow back to a stale value.
    robots.forEach(function (r) {
        var arrow = directionArrows[r.RobotID];
        if (!arrow) return;
        if (Date.now() - (lastDirectionTap[r.RobotID] || 0) < DIRECTION_TAP_HOLD_MS) return;
        pendingDirections[r.RobotID] = r.Dir || 1;
        renderGmDirectionArrow(r.RobotID);
    });

    document.getElementById('noPlayerButtons').style.display =
        (!batteryMode || buttons.children.length || dirButtons.children.length || showGmStart) ? 'none' : '';
}

// ── Battery view ─────────────────────────────────────────────────────────────
// Tapping the F/E/C header flips between flags/energy/cards + status and each robot's battery +
// board position. The battery/position come from their own call, /api/robot/info, not from the
// AllDataUpdate broadcast; it is re-fetched every couple of seconds while the view is showing.
// The battery is the robot's own percentage (ws_status robot.battery), recorded when a move
// completes, so it can be a move or two out of date.
var batteryMode = false;
var robotInfo = {};          // RobotID -> {battery, row, col, dir}
var robotInfoTimer = null;

function toggleFlagsHeader() {
    batteryMode = !batteryMode;
    document.getElementById('flagsHeader').innerText = batteryMode ? 'Battery' : 'F/E/C';
    if (batteryMode) {
        refreshRobotInfo();
        robotInfoTimer = setInterval(refreshRobotInfo, 2000);
    } else {
        clearInterval(robotInfoTimer);
        robotInfoTimer = null;
    }
    if (datapacket) showall(); // swap the right pane and the robot buttons' action now
}

function refreshRobotInfo() {
    fetch('/api/robot/info')
        .then(function (resp) { return resp.json(); })
        .then(function (list) {
            robotInfo = {};
            list.forEach(function (i) { robotInfo[i.robotID] = i; });
            if (datapacket) showall();
        })
        .catch(function (err) { console.error(err.toString()); });
}

// ── Swap a robot's base ──────────────────────────────────────────────────────
// Only for a robot that isn't connected (or connecting). The chosen base's IP is used for this
// robot for the rest of the current game; connect it afterwards to dial the new address.
var CONNECT_STATUS_CONNECTING = 21; // tPlayerStatus.Connecting (MRR.Contracts/PlayerState.cs)

function makeBasePickerHandler(r) {
    var connected = r.ConnectStatusID === CONNECT_STATUS_CONNECTED || r.ConnectStatusID === CONNECT_STATUS_CONNECTING;
    return connected ? null : function () { openBasePicker(r); };
}

function makeSelectRobotHandler(priority) {
    return function () { selectRobot(priority); };
}

function openBasePicker(r) {
    fetch('/api/robot/bases/' + r.RobotID)
        .then(function (resp) { return resp.json(); })
        .then(function (bases) {
            var list = document.getElementById('basePickerList');
            list.innerHTML = '';
            bases.forEach(function (b) {
                var btn = document.createElement('button');
                btn.className = 'button';
                // The global .button class sets width:100%/height:30px; override both so each
                // entry is only as big as its text.
                btn.style = 'display:block; width:auto; height:auto; min-height:44px; margin:3px 0; padding:4px 14px; font-size:18px;' +
                    (b.isCurrent ? ' border:2px solid #000000;' : '');
                btn.textContent = b.aimName + (b.isCurrent ? ' (current)' : '');
                btn.title = b.ipAddress;
                btn.onclick = function () { chooseBase(r.RobotID, b.robotBaseID); };
                list.appendChild(btn);
            });
            document.getElementById('basePicker').style.display = 'block';
        })
        .catch(function (err) { console.error(err.toString()); });
}

function chooseBase(robotId, robotBaseId) {
    fetch('/api/robot/setbase/' + robotId + '/' + robotBaseId)
        .then(function (resp) {
            if (resp.ok) { closeBasePicker(); return; }
            return resp.json().then(function (e) { alert(e.error || 'Could not change the base'); });
        })
        .catch(function (err) { console.error(err.toString()); });
}

function closeBasePicker() {
    document.getElementById('basePicker').style.display = 'none';
}

var lastPlayerMsgKey = null;
var lastDirectionKey = null;
var pendingDirections = {}; // RobotID -> Direction int (1-4) shown on that robot's arrow
var directionArrows = {};   // RobotID -> that robot's arrow <img>, while it's shown
var lastDirectionTap = {};  // RobotID -> Date.now() of the GM's last arrow tap (hold time: DIRECTION_TAP_HOLD_MS, js/loadrobots.js)

function renderGmDirectionArrow(robotId) {
    directionArrows[robotId].style.transform =
        'rotate(' + DIRECTION_DEGREES[pendingDirections[robotId]] + 'deg)';
}

// Per-robot version of index.html's #directionPickerRow (see the direction picker section of
// js/loadrobots.js). PositionValid 0: arrow (cycles CurrentPosDir, command 4) plus "Set
// Direction" (command 5, value 1). PositionValid 1: only "Clear Direction" (command 5, value 0).
// No seat adjustment on the arrow -- GM sees the board-absolute direction.
function makeDirectionRow(r) {
    var row = document.createElement('div');
    row.style = "margin:0 0 6px 0; display:flex; align-items:center; gap:8px;";

    var label = document.createElement('span');
    label.textContent = r.RobotName;
    label.style = "min-width:80px; padding:6px 8px; background-color:#" + r.RobotColor + "; color:#" + r.RobotColorFG;
    row.appendChild(label);

    if (r.PositionValid === 0) {
        // Rotation is set by showall() right after the rows are built.
        var arrow = document.createElement('img');
        arrow.src = 'images/Direction1.png';
        arrow.style = "width:52px; height:52px; cursor:pointer;";
        arrow.onclick = function () {
            lastDirectionTap[r.RobotID] = Date.now();
            pendingDirections[r.RobotID] = (pendingDirections[r.RobotID] % 4) + 1; // 1->2->3->4->1
            renderGmDirectionArrow(r.RobotID);
            SendUpdate(4, r.RobotID, pendingDirections[r.RobotID]);
        };
        directionArrows[r.RobotID] = arrow;
        row.appendChild(arrow);
    }

    var b = document.createElement('button');
    b.className = 'button';
    b.style = "width:auto; padding:6px 14px; background-color:#800080; color:#ffffff;";
    b.textContent = r.PositionValid === 0 ? 'Set Direction' : 'Clear Direction';
    var newValid = r.PositionValid === 0 ? 1 : 0;
    b.onclick = function () { SendUpdate(5, r.RobotID, newValid); };
    row.appendChild(b);

    return row;
}

// Same confirm (command 3) as index.html's #btnMessagebox, but for whichever robot the
// message belongs to rather than the one currently selected.
function makePlayerMsgButton(r) {
    var b = document.createElement('button');
    b.className = 'button';
    b.style = "";
    b.textContent = r.RobotName + ': ' + r.PlayerMsg;
    b.onclick = function () { SendUpdate(3, r.RobotID); };
    return b;
}
</script>
