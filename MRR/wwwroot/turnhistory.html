<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turn History</title>
<style>
    body { background: #222; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    .nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .nav button { font-size: 18px; padding: 4px 14px; }
    table { border-collapse: collapse; width: 100%; max-width: 640px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #444; }
    th { color: #aaa; font-weight: normal; font-size: 13px; }
    .name { font-weight: bold; border-radius: 4px; }
    .cards { font-family: monospace; font-size: 24px; letter-spacing: 4px; }
    .executed { font-family: monospace; font-size: 16px; letter-spacing: 2px; color: #ffcc00; }
    .pri { font-size: 20px; color: #aaa; }
    .fec { font-family: monospace; font-size: 16px; }
    .dir { width: 22px; height: 22px; vertical-align: middle; }
    #savedAt { color: #aaa; font-size: 14px; margin-left: 6px; }
    #msg { color: #aaa; margin-top: 12px; }
</style>
</head>
<body>
<h1>Turn <span id="turn">-</span> &mdash; start positions &amp; cards, in priority order</h1>
<div class="nav">
    <button id="prev">&laquo; Prev</button>
    <button id="next">Next &raquo;</button>
    <button onclick="window.close()">Close</button>
    <span id="savedAt"></span>
</div>
<table>
    <thead><tr><th>#</th><th>Robot</th><th>Start</th><th title="Flag / Energy / Cards at the start of the turn">F/E/C</th><th>Cards</th></tr></thead>
    <tbody id="rows"></tbody>
</table>
<div id="msg"></div>
<script>
    var shownTurn = null;
    var DIRECTION_DEGREES = { 1: 0, 2: 90, 3: 180, 4: 270 }; // Up, Right, Down, Left

    function load(turn) {
        var url = '/api/history/turn' + (turn == null ? '' : '/' + turn);
        fetch(url).then(function (r) { return r.json(); }).then(function (d) {
            shownTurn = d.turn;
            document.getElementById('turn').textContent = d.turn;
            // Timestamp of the first robot in priority order (the row shown first).
            var first = d.robots[0];
            document.getElementById('savedAt').textContent = first && first.savedAt ? first.savedAt : '';
            document.getElementById('next').disabled = d.turn + 1 >= d.currentTurn;
            document.getElementById('prev').disabled = d.turn <= 1;

            var tbody = document.getElementById('rows');
            tbody.innerHTML = '';
            d.robots.forEach(function (r) {
                var tr = document.createElement('tr');

                var pri = document.createElement('td');
                pri.className = 'pri';
                pri.textContent = r.priority;
                tr.appendChild(pri);

                var name = document.createElement('td');
                var chip = document.createElement('span');
                chip.className = 'name';
                chip.textContent = ' ' + (r.name || 'Robot ' + r.robotID) + ' ';
                chip.style.background = '#' + r.color;
                chip.style.color = '#' + r.colorFG;
                chip.style.padding = '2px 8px';
                name.appendChild(chip);
                tr.appendChild(name);

                var start = document.createElement('td');
                start.textContent = 'R' + r.startRow + ' C' + r.startCol + ' ';
                // Same rotated arrow as gmindex.html's robot list. ShortDirDesc can't be shown
                // as text: RobotDirections stores > and < as the entities &gt; / &lt;.
                if (DIRECTION_DEGREES[r.startDirID] !== undefined) {
                    var dirImg = document.createElement('img');
                    dirImg.className = 'dir';
                    dirImg.src = 'images/Direction1.png';
                    dirImg.alt = ['', 'Up', 'Right', 'Down', 'Left'][r.startDirID];
                    dirImg.style.transform = 'rotate(' + DIRECTION_DEGREES[r.startDirID] + 'deg)';
                    start.appendChild(dirImg);
                } else {
                    start.appendChild(document.createTextNode('?'));
                }
                tr.appendChild(start);

                var fec = document.createElement('td');
                fec.className = 'fec';
                fec.textContent = r.fec || '-';
                tr.appendChild(fec);

                var cards = document.createElement('td');
                cards.className = 'cards';
                cards.textContent = r.cards;
                // Only when a Spam register ran a different card than was programmed.
                if (r.executed && r.executed !== r.cards) {
                    var executed = document.createElement('div');
                    executed.className = 'executed';
                    executed.textContent = 'ran ' + r.executed;
                    cards.appendChild(executed);
                }
                tr.appendChild(cards);

                tbody.appendChild(tr);
            });
            document.getElementById('msg').textContent =
                d.robots.length ? '' : 'No history saved for turn ' + d.turn + '.';
        }).catch(function () {
            document.getElementById('msg').textContent = 'Could not load turn history.';
        });
    }

    document.getElementById('prev').onclick = function () { load(shownTurn - 1); };
    document.getElementById('next').onclick = function () { load(shownTurn + 1); };

    // ?turn=N shows that turn; no parameter shows the previous turn.
    var requested = parseInt(new URLSearchParams(location.search).get('turn'), 10);
    load(requested > 0 ? requested : null);
</script>
</body>
</html>
