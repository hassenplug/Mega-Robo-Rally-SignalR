<html>
<head>

<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel="stylesheet" type="text/css" href="style/checkbox.css">
<link rel="stylesheet" type="text/css" href="style/button.css">
<link rel="stylesheet" type="text/css" href="style/w3.css">

<meta name="theme-color" content="#aaffff">

<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<script src="js/signalr.min.js"></script>
<script src="js/jquery.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/datahub-connection.js" type="text/javascript" charset="utf-8"></script>
<script src="js/loadrobots.js" type="text/javascript" charset="utf-8"></script>

<title>MEGA Robo Rally</title>

<style>
a:link {
    text-decoration: none;
	color: #000000;
}

a:visited {
    text-decoration: none;
	color: #000000;
}


</style>

</head>
<body id='body' style='padding:5px; padding-top:0px'>

<!-- Login gate: this phone must be tied to one robot (or the GM code) before it can see
     any cards. See js/loadrobots.js (applyLogin/chooseRobotLogin/attemptGmLogin). -->
<div id="loginModal" class="w3-modal">
    <div class="w3-modal-content w3-round w3-white" style="max-width:320px; padding:16px;">
        <h3 style="margin-top:0;">Who are you?</h3>
        <p>Tap your robot:</p>
        <div id="loginRobotButtons"></div>
        <hr>
        <p>GM login code:</p>
        <input type="text" id="gmCodeInput" class="w3-input" inputmode="numeric" autocomplete="off">
        <button class="button" style="margin-top:8px; background-color:#444444; color:#ffffff;" onclick="attemptGmLogin();">Log In as GM</button>
        <p id="loginError" style="color:#cc0000; display:none;">Incorrect code.</p>
    </div>
</div>

<table bgcolor="ffffff" border=0 width=100%>
<tr bgcolor="#d0d0d0">
<td id="robotHeader" style="cursor:pointer; position:relative;" onclick="toggleGmMenu();">Robot
    <!-- GM-only game controls, shown on tap while logged in as GM. See toggleGmMenu()/
         gmAction() in js/loadrobots.js. Positioned relative to this <td> so it drops down
         right under the header regardless of scroll position. -->
    <div id="gmMenu" class="w3-card-4" style="display:none; position:absolute; top:100%; left:0; z-index:5; background:#ffffff; padding:6px; min-width:140px;">
        <button class="button" style="margin-bottom:4px;" onclick="event.stopPropagation(); gmAction('startgame');">Start Game</button>
        <button class="button" style="margin-bottom:4px;" onclick="event.stopPropagation(); gmAction('nextstate');">Next State</button>
        <button class="button" style="background-color:#cc0000; color:#ffffff;" onclick="event.stopPropagation(); if(confirm('End the current game and disconnect from robots?')) gmAction('endgame');">End Game</button>
    </div>
</td>
<td align=center id="flagsHeader" style="cursor:pointer;" onclick="toggleFlagsHeader();">F/E/C</td>
<td align=center id="statusHeader">Status</td>
<td align=center width = 40% id="title" style="cursor:pointer;" onclick="toggleGmView();">---</td>
</tr>
<tbody id="playerRows"></tbody>
</table>

<template id="showProgramTemplate">
    <table bgcolor="e0e0e0" width="100%">
        <tr id="messagetable" style="display: none;">
            <td colspan="5">
                <button class='button' id="btnMessagebox" style='background-color:ff0000; color:ffffff' onclick='confirmMessage();'>
                    PlayerMsg
                </button>
            </td>
        </tr>
        <tr id="directionPickerRow" style="display: none;">
            <td colspan="5" align="center">
                <div></div>
                <img id="directionBtn" src="images/Direction1.png" onclick="cycleDirection();" style="width:40px; height:40px; cursor:pointer;">
                <button id="directionConfirmBtn" class="button" style="margin-top:6px; background-color:#800080; color:#ffffff; width:auto; padding:6px 16px;" onclick="confirmDirection();">Set Direction</button>
            </td>
        </tr>
        <!-- GM mode + no game running (datapacket.IsRunning falsy): pick a GameData row by
             its Description and start it. Populated/shown by showall() in js/loadrobots.js. -->
        <tr id="gmtable" style="display: none;">
            <td colspan="5" align="center">
                <button class="button" style="width:auto; padding:6px 16px; background-color:#008000; color:#ffffff;" onclick="startSelectedGame();">Start</button>
                <select id="gameDataSelect" class="w3-input" style="display:inline-block; width:auto; margin-right:8px;"></select>
            </td>
        </tr>
        <tr id="messagetablespace" style="display: none;"><td colspan="5"><br></td></tr>
        <tr bgcolor="#d0d0d0">
            <td align=center bgcolor=ffffff id='CardCell0'><img id='Played0' src='images/type0.png' onclick='PlayCard(this);' width='50' tag=1/></td>
            <td align=center bgcolor=ffffff id='CardCell1'><img id='Played1' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff id='CardCell2'><img id='Played2' src='images/type0.png' onclick='PlayCard(this);' width='50' tag=3/></td>
            <td align=center bgcolor=ffffff id='CardCell3'><img id='Played3' src='images/type0.png' onclick='PlayCard(this);' width='50' tag=4/></td>
            <td align=center bgcolor=ffffff id='CardCell4'><img id='Played4' src='images/type0.png' onclick='PlayCard(this);' width='50' tag=5/></td>
        </tr>
        <tr><td colspan="5"><br></td></tr>
        <tr id="DealtRow1">
            <td align=center bgcolor=ffffff><img id='Dealt0' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt1' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt2' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt3' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt4' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
        </tr>
        <tr id="DealtRow2">
            <td align=center bgcolor=ffffff><img id='Dealt5' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt6' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt7' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt8' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
            <td align=center bgcolor=ffffff><img id='Dealt9' src='images/type0.png' onclick='PlayCard(this);' width='50'/></td>
        </tr>
    </table>
</template>

</body>
</html>
