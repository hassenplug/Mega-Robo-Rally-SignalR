<html>
<head>

<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel="stylesheet" type="text/css" href="style/button.css">
<link rel="stylesheet" type="text/css" href="style/w3.css">

<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<script src="js/signalr.min.js"></script>
<script src="js/connectscreen.js" type="text/javascript" charset="utf-8"></script>

<title>MRR Robot Connections</title>

<style>
body { font-family: sans-serif; }
#menuBar { position: relative; margin-bottom: 10px; }
#btnMenu { width: 44px; font-size: 18px; }
#menuDropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #ffffff;
    border: 1px solid #999;
    z-index: 10;
    min-width: 160px;
    flex-direction: column;
}
#menuDropdown.open { display: flex; }
#menuDropdown button { padding: 8px 12px; text-align: left; }
table.robots { border-collapse: collapse; width: 100%; max-width: 400px; }
table.robots td { border-bottom: 1px solid #ccc; }
</style>

</head>
<body id='body' style='padding:10px;'>


<div id="menuBar">
<button class="button" id="btnMenu" onclick="toggleMenu();">&#9776;</button>
<div id="menuDropdown">
<button class="button" onclick="connectAll(); closeMenu();">Connect All</button>
<button class="button" onclick="disconnectAll(); closeMenu();">Disconnect All</button>
<button class="button" id="btnSearch" onclick="searchRobots(); closeMenu();">Search</button>
<button class="button" id="btnUpdateIp" onclick="toggleEditMode(); closeMenu();">Update IP</button>
</div>
</div><h3>Connections</h3>


<table class="robots">
<tbody id="robotRows"></tbody>
</table>

</body>
</html>
